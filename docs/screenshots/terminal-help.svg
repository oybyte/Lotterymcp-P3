<text x="72" y="132" fill="#7ee787" font-size="24" font-family="Consolas, Microsoft YaHei UI, monospace">$ npx --yes lotterymcp@latest</text>
<line x1="64" y1="154" x2="1436" y2="154" stroke="#2a2e35"/>
<text x="72" y="194" fill="#f2cc60" font-size="24" font-family="Consolas, Microsoft YaHei UI, monospace">支持彩种: 排列3 (pl3)</text>
<text x="72" y="232" fill="#d9dde3" font-size="24" font-family="Consolas, Microsoft YaHei UI, monospace">1. 注册/登录并获取 Token</text>
<text x="72" y="270" fill="#d9dde3" font-size="24" font-family="Consolas, Microsoft YaHei UI, monospace">2. 配置接口地址、Token、默认期数</text>
<text x="72" y="308" fill="#d9dde3" font-size="24" font-family="Consolas, Microsoft YaHei UI, monospace">3. 生成 MCP 配置片段</text>
<text x="72" y="346" fill="#d9dde3" font-size="24" font-family="Consolas, Microsoft YaHei UI, monospace">4. 检查配置、缓存和预测账本</text>
<text x="72" y="384" fill="#d9dde3" font-size="24" font-family="Consolas, Microsoft YaHei UI, monospace">5. 启动 MCP 服务</text>
<text x="72" y="422" fill="#d9dde3" font-size="24" font-family="Consolas, Microsoft YaHei UI, monospace">6. 生成排列3预测与回测</text>
<text x="72" y="460" fill="#d9dde3" font-size="24" font-family="Consolas, Microsoft YaHei UI, monospace">7. 同步公开开奖数据</text>
<text x="72" y="498" fill="#d9dde3" font-size="24" font-family="Consolas, Microsoft YaHei UI, monospace">0. 退出</text>
