name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run reproduce
      - run: npm run docs:screenshots:check
      - run: npm audit --omit=dev
      - run: npm pack --dry-run --workspace lotterymcp-core --workspace lotterymcp-server --workspace neuxnbcp --workspace lotterymcp
      - run: git diff --check

  node20-sqlite-smoke:
    name: Node 20 SQLite smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/ci-pack-smoke.mjs
